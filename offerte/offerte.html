<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Offerte</title>
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>
    <header>
        <div class="logo">Piattaforma</div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../analisi/analisi.html">Analisi</a></li>
                <li><a href="../ordini/ordini.html">Ordini</a></li>
                <li><a href="offerte.html" class="active">Offerte</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="card">
            <h1>Generatore Offerte</h1>
            <p>Compila il modulo per generare una nuova offerta commerciale personalizzata.</p>
            <form style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 600px;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Nome Cliente</label>
                    <input type="text" placeholder="Inserisci nome cliente o azienda" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.6);">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Valore Stimato (€)</label>
                    <input type="number" placeholder="0.00" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.6);">
                </div>
                <button type="button" style="padding: 0.75rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; align-self: flex-start;">Crea Offerta</button>
            </form>
        </div>
    </main>
    <script src="offerte.js"></script>
</body>
</html>
